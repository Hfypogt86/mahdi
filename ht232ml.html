<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحقق من كلمة السر</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; }
        input, button { font-size: 18px; margin: 10px; padding: 8px; }
        #result { font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <h2>ادخل كلمة السر</h2>
    <input type="password" id="password">
    <button onclick="checkPassword()">تحقق</button>
    <p id="result"></p>

    <script>
        function checkPassword() {
            var password = document.getElementById("password").value;
            var result = document.getElementById("result");
            
            if (password === "مهدي") {
                result.textContent = "صح";
                result.style.color = "green";
            } else {
                result.textContent = "غلط";
                result.style.color = "red";
            }
        }
    </script>
</body>
</html>
